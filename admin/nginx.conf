# -*- coding: utf-8 -*-
# Nginx للوحة التحكم: يخدم ملفات Vite المبنية ويمرّر /api و/health إلى خدمة api.
# يُنسخ إلى /etc/nginx/conf.d/default.conf داخل صورة nginx.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # يطابق MAX_UPLOAD_BYTES الافتراضي (25MB) في الخدمة، بهامش لغلاف multipart
    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # أصول Vite تحمل بصمة في الاسم — تخزين طويل الآمد
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # الـAPI: بلا شرطة في نهاية proxy_pass كي يبقى المسار كما هو (/api/v1/...)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # فحص الجهوزية الذي تراقبه Uptime Kuma — يعكس حالة قاعدة البيانات
    location = /health {
        access_log off;
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # تطبيق صفحة واحدة: أي مسار غير موجود يعود إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
