name: csit
description: "تطبيق كلية علوم الحاسوب وتكنولوجيا المعلومات — جامعة القادسية (iq.edu.qu.csit)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # الشبكة والتخزين الآمن والملاحة.
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  cupertino_icons: ^2.0.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  # الإشعارات المحلية والدفع (FCM) واختيار صورة العذر.
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  image_picker: ^1.2.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
