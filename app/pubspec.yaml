name: csit
description: "تطبيق كلية علوم الحاسوب وتكنولوجيا المعلومات — جامعة القادسية (iq.edu.qu.csit)"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # الشبكة والتخزين الآمن والملاحة — الحد الأدنى لمرحلة المصادقة.
  # بقية الاعتماديات (Drift، QR، FCM، PDF، الموقع) تُضاف مع مرحلتها بحسب الخطة.
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  cupertino_icons: ^2.0.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
