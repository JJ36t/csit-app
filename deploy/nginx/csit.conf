# -*- coding: utf-8 -*-
# Nginx لمستودع csit-app على سيرفر الجامعة (بلا Docker): يخدم لوحة التحكم المبنية
# ويعكس /api/ و/health إلى خدمة FastAPI على 127.0.0.1:8000.
#
# التثبيت:
#   sudo cp /opt/csit/deploy/nginx/csit.conf /etc/nginx/sites-available/csit.conf
#   sudo ln -sf /etc/nginx/sites-available/csit.conf /etc/nginx/sites-enabled/csit.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# على RHEL/Rocky: ضعه في /etc/nginx/conf.d/csit.conf (بلا sites-enabled) وافتح المنافذ
# بـfirewall-cmd، وفعّل: setsebool -P httpd_can_network_connect 1

server {
    listen 80;
    # إن كان IPv6 مفعّلاً على الخادم أضف: listen [::]:80;
    # (bind يفشل عند إعادة التحميل إن كان IPv6 معطّلاً، وnginx -t لا يكشفه)

    # ⚠️ استبدله بالنطاق الجامعي الحقيقي قبل certbot — إصدار الشهادة يعتمد عليه
    server_name csit.example.edu.iq;

    root /opt/csit/admin/dist;
    index index.html;

    server_tokens off;

    # يطابق max_upload_bytes في الخدمة (25MB) بهامش لغلاف multipart
    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # ترويسات أمان لكل الردود. تُورَّث إلى location فقط إن لم تحمل add_header خاصاً بها،
    # لذلك نتجنّب add_header داخل location هنا ونستخدم expires لتخزين الأصول.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: فعّلها بعد نجاح TLS وتأكّد من تحويل 80→443 (certbot --redirect)
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # أصول Vite تحمل بصمة في الاسم — تخزين طويل الآمد
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # الـAPI: بلا شرطة في نهاية proxy_pass كي يبقى المسار كما هو (/api/v1/...)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # فحص الجهوزية الذي تُراقبه Uptime Kuma: 200 = ok، 503 = قاعدة البيانات متعطّلة
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # تطبيق صفحة واحدة: أي مسار غير موجود يعود إلى index.html (توجيه React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
