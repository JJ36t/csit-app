# Nginx — نشر كلية علوم الحاسوب (TLS + API + لوحة التحكم + سياسة الخصوصية)
#
# الاستخدام على سيرفر الجامعة (Ubuntu/Debian):
#   sudo cp csit.conf /etc/nginx/sites-available/csit.conf
#   sudo ln -s /etc/nginx/sites-available/csit.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# قبل التشغيل: استبدل csit.qu.edu.iq بالنطاق الفرعي الفعلي، وضع شهادة صادرة
# (Let's Encrypt أو شهادة الجامعة) في المسارات أدناه.

upstream csit_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# إجبار HTTPS — لا تُخدم أي بيانات طلاب على HTTP
server {
    listen 80;
    listen [::]:80;
    server_name csit.qu.edu.iq;

    # تحدّي ACME يبقى على HTTP كي يتجدد الشهادة تلقائياً
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 داخل listen يعمل على nginx 1.24 (Ubuntu 24.04) و1.25+ (مع تحذير إهمال)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name csit.qu.edu.iq;

    ssl_certificate     /etc/letsencrypt/live/csit.qu.edu.iq/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csit.qu.edu.iq/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS سنة كاملة — لا تراجع عنه إلا بقرار أمني موثّق
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ملفات الأعذار حتى 25MB + هامش
    client_max_body_size 26m;
    client_body_timeout 60s;

    access_log /var/log/nginx/csit.access.log;
    error_log  /var/log/nginx/csit.error.log warn;

    # --- الـAPI ---
    location /api/ {
        proxy_pass         http://csit_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    location = /health {
        proxy_pass       http://csit_api/health;
        proxy_set_header Host $host;
        access_log       off;
    }

    # --- لوحة التحكم (بناء Vite في /var/www/csit-admin) ---
    location /admin/ {
        alias /var/www/csit-admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # --- سياسة الخصوصية (صفحة ثابتة) ---
    location = /privacy {
        root /var/www/csit;
        try_files /privacy.html =404;
    }

    # لا تُكشف ملفات المرفوعات مباشرة — التنزيل عبر روابط موقّعة من الـAPI فقط
    location /uploads/ {
        return 404;
    }

    location / {
        return 404;
    }
}
