name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — pytest على SQLite وPostgreSQL + فحص الترحيلات
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: csit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: تثبيت الاعتماديات
        working-directory: api
        run: python -m pip install -r requirements-dev.txt

      - name: اختبارات SQLite
        working-directory: api
        env:
          DATABASE_URL: sqlite:///./test_api.db
        run: python -m pytest tests -q

      - name: اختبارات PostgreSQL
        working-directory: api
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/csit_test
        run: python -m pytest tests -q

      - name: ترحيلات نظيفة على قاعدة فارغة (alembic upgrade + check)
        working-directory: api
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/csit
        run: |
          createdb -h 127.0.0.1 -U postgres csit
          python -m alembic upgrade head
          python -m alembic check

  app:
    name: تطبيق Flutter — analyze + test + build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: الاعتماديات والتوليد
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: التحليل والاختبارات
        working-directory: app
        run: |
          flutter analyze
          flutter test

      - name: بناء الويب
        working-directory: app
        run: flutter build web --release

  admin:
    name: لوحة التحكم — npm ci + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: التثبيت والبناء
        working-directory: admin
        run: |
          npm ci
          npm run build

  images:
    name: صور Docker — بناء (API + لوحة التحكم)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: بناء صورة API
        run: docker build -t csit-api:ci api

      - name: بناء صورة لوحة التحكم
        run: docker build -t csit-admin:ci admin

      - name: التحقق من حجم الصور
        run: docker images --format 'table {{.Repository}}\t{{.Size}}'
